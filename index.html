  --bg:#f3f6fc;--surface:#fff;--surface2:#e9eef9;--fg:#0f1b3d;--muted:#5a6788;--line:#dbe3f3;
  --accent:#1d4ed8;--accent-fg:#fff;--me:#dbe7ff;--chat:#eef2fb;--danger:#c0262d;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226;--surface:#121b36;--surface2:#1a2547;--fg:#e8eeff;--muted:#9aa8cc;--line:#243157;
  --accent:#6ea0ff;--accent-fg:#0b1226;--me:#1e3a78;--chat:#0e1630;--danger:#ff8f94}}
:root[data-theme="dark"]{--bg:#0b1226;--surface:#121b36;--surface2:#1a2547;--fg:#e8eeff;--muted:#9aa8cc;--line:#243157;
  --accent:#6ea0ff;--accent-fg:#0b1226;--me:#1e3a78;--chat:#0e1630;--danger:#ff8f94}
:root[data-accent="green"]{--accent:#15803d}
:root[data-accent="purple"]{--accent:#7e22ce}
:root[data-accent="orange"]{--accent:#c2410c}
:root[data-accent="green"][data-theme="dark"],:root[data-accent="green"]:not([data-theme="light"]){}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.logo{width:34px;height:34px;border-radius:10px;flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1;flex:1;min-width:0}
.brand select{display:block;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:0;max-width:100%}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 20px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:9px 18px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:none;color:var(--danger);padding:6px 10px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.field{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
textarea.field{resize:vertical;min-height:70px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;text-align:left;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.sub.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{color:var(--muted);font-size:12px;align-self:flex-start}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:32px;height:32px;font-size:13px}.avatar.lg{width:96px;height:96px;font-size:34px}
.avatar.sq{border-radius:14px}
.empty{color:var(--muted);padding:28px 4px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{border-radius:18px;padding:18px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;color:#fff;background:linear-gradient(135deg,var(--accent),#0b1f66) center/cover;margin-bottom:6px}
.hero.img{text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero b{font-size:20px}
.hero .btn{align-self:flex-start;background:#fff;color:#0f1b3d}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px}
/* room */
#room{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.roomhead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.roomhead .t{flex:1;min-width:0}.roomhead .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomhead .t span{font-size:12px;color:var(--muted)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;background:var(--chat)}
#msgs[data-bg="dots"]{background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--fg) 16%,transparent) 1px,transparent 0) 0 0/18px 18px,var(--chat)}
#msgs[data-bg="waves"]{background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--accent) 9%,transparent) 14px 16px),var(--chat)}
#msgs[data-bg="grid"]{background:linear-gradient(color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px) 0 0/22px 22px,var(--chat)}
#msgs[data-bg="dawn"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,var(--chat)),var(--chat) 70%)}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 12px;margin:10px 0 6px}
.msg{display:flex;flex-direction:column;max-width:82%;min-width:0}
.msg.mine{align-self:flex-end;align-items:flex-end}.msg.them{align-self:flex-start}
.bubble{background:var(--surface);border-radius:16px 16px 16px 4px;padding:7px 11px 5px;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
.mine .bubble{background:var(--me);border-radius:16px 16px 4px 16px}
.who{font-size:12px;font-weight:700;color:var(--accent);margin:4px 0 1px 4px}
.stamp{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.bubble img,.bubble video{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-bottom:4px}
.file{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-weight:600;padding:4px 0}
.quote{background:var(--surface2);border-radius:10px;padding:4px 9px;margin-bottom:5px;font-size:13px;color:var(--muted)}
.msgtools{display:none;gap:6px;margin-top:3px}.msg.open .msgtools{display:flex}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:9px 14px;resize:none;max-height:120px}
.sendbtn{background:var(--accent);color:var(--accent-fg);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.sendbtn:disabled{opacity:.45}
#replybar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--surface);color:var(--muted)}
/* feed */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;font-size:12px;color:var(--muted)}
.story span:last-child{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:2px;border-radius:50%;background:conic-gradient(var(--accent),#7aa2ff,var(--accent))}
.ring .avatar{border:2px solid var(--bg);width:52px;height:52px}
.ring.add{background:var(--surface2);display:grid;place-items:center;width:56px;height:56px;color:var(--accent)}
.post{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post .head{display:flex;align-items:center;gap:10px}
.post .media{width:100%;max-height:480px;object-fit:cover;border-radius:14px;display:block;background:var(--surface2)}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.actions{display:flex;gap:18px}
.act{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.act.on{color:var(--danger)}.act.on .icon{fill:currentColor}
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.swatch{width:36px;height:36px;border-radius:50%;outline:2px solid transparent;outline-offset:2px}
.swatch[aria-checked="true"]{outline-color:var(--fg)}
.date{width:48px;text-align:center;border-radius:12px;background:var(--surface2);padding:6px 0;flex:none}
.date b{display:block;font-size:20px;line-height:1.1}.date span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent)}
/* sheet */
#sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-height:90%;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sheet .sbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.sheet h2{margin:0;font-size:19px}.sheethead{display:flex;align-items:center;justify-content:space-between}
#storyview{position:absolute;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff}
#storyview .stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
#storyview img,#storyview video{max-width:100%;max-height:100%;object-fit:contain}
#storyview .cap{padding:12px 16px;text-align:center}
#storyview .bar{height:3px;background:#fff4;margin:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
#storyview .bar i{display:block;height:100%;width:0;background:#fff}
#storyhead{display:flex;align-items:center;gap:10px;padding:8px 12px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90%;text-align:center}
/* auth */
#auth{height:100%;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
#auth h1{margin:8px 0 0;font-size:28px;letter-spacing:-.02em}
#auth p{margin:0;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:20px}
[hidden]{display:none!important}
</style>
</head>

function start(session){

  S.uid=session.user.id;
  loadCore().then(function(){buildShell();setTab("home");return loadCampusData()}).then(subscribe).catch(function(e){
    $("#app").textContent="";$("#app").append(h("div",{id:"auth"},h("h1",{text:"Couldn't start"}),h("p",{text:(e&&e.message)||"Reload the page to try again."}),h("button",{class:"btn",onclick:function(){location.reload()}},"Reload")))});

function boot(){
  applyMode();
  if(!window.supabase){$("#app").textContent="Couldn't load. Check your connection and reload.";return}
  if(SUPABASE_ANON_KEY.indexOf("PASTE")===0){$("#app").append(h("div",{id:"auth"},h("h1",{text:"One step left"}),h("p",{text:"Open index.html and paste your Supabase publishable (anon) key where it says PASTE_YOUR_ANON_KEY_HERE."})));return}
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var first=true;
  S.sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){
      if(ev==="SIGNED_IN"&&!first&&S.uid===(session&&session.user.id))return;
      first=false;setTimeout(function(){start(session)},0)}
  });
  if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}

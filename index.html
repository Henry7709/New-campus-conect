<style>
:root{
  --h:222;
  --bg:#f3f6fc;--surface:#fff;--surface2:#e9eef9;--fg:#0f1b3d;--muted:#5a6788;--line:#dbe3f3;
  --accent:#1d4ed8;--accent-fg:#fff;--me:#dbe7ff;--chat:#eef2fb;--danger:#c0262d;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226;--surface:#121b36;--surface2:#1a2547;--fg:#e8eeff;--muted:#9aa8cc;--line:#243157;

:root[data-theme="dark"]{--bg:#0b1226;--surface:#121b36;--surface2:#1a2547;--fg:#e8eeff;--muted:#9aa8cc;--line:#243157;
  --accent:#6ea0ff;--accent-fg:#0b1226;--me:#1e3a78;--chat:#0e1630;--danger:#ff8f94}
:root[data-accent="green"]{--accent:#15803d}
:root[data-accent="purple"]{--accent:#7e22ce}
:root[data-accent="orange"]{--accent:#c2410c}
:root[data-accent="green"][data-theme="dark"],:root[data-accent="green"]:not([data-theme="light"]){}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.logo{width:34px;height:34px;border-radius:10px;flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1;flex:1;min-width:0}
.brand select{display:block;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:0;max-width:100%}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 20px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:9px 18px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:none;color:var(--danger);padding:6px 10px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.field{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
textarea.field{resize:vertical;min-height:70px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;text-align:left;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.sub.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{color:var(--muted);font-size:12px;align-self:flex-start}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:32px;height:32px;font-size:13px}.avatar.lg{width:96px;height:96px;font-size:34px}
.avatar.sq{border-radius:14px}
.empty{color:var(--muted);padding:28px 4px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{border-radius:18px;padding:18px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;color:#fff;background:linear-gradient(135deg,var(--accent),#0b1f66) center/cover;margin-bottom:6px}
.hero.img{text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero b{font-size:20px}
.hero .btn{align-self:flex-start;background:#fff;color:#0f1b3d}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px}
/* room */
#room{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.roomhead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.roomhead .t{flex:1;min-width:0}.roomhead .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomhead .t span{font-size:12px;color:var(--muted)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;background:var(--chat)}
#msgs[data-bg="dots"]{background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--fg) 16%,transparent) 1px,transparent 0) 0 0/18px 18px,var(--chat)}
#msgs[data-bg="waves"]{background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--accent) 9%,transparent) 14px 16px),var(--chat)}
#msgs[data-bg="grid"]{background:linear-gradient(color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px) 0 0/22px 22px,var(--chat)}
#msgs[data-bg="dawn"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,var(--chat)),var(--chat) 70%)}
#msgs[data-bg="image"]{background-size:cover;background-position:center;background-repeat:no-repeat}
.banner{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 12px;margin:10px 0 6px}
.msg{display:flex;flex-direction:column;max-width:82%;min-width:0}
.msg.mine{align-self:flex-end;align-items:flex-end}.msg.them{align-self:flex-start}
.bubble{background:var(--surface);border-radius:16px 16px 16px 4px;padding:7px 11px 5px;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
.mine .bubble{background:var(--me);border-radius:16px 16px 4px 16px}
.who{font-size:12px;font-weight:700;color:var(--accent);margin:4px 0 1px 4px}
.stamp{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.bubble img,.bubble video{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-bottom:4px}
.file{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-weight:600;padding:4px 0}
.quote{background:var(--surface2);border-radius:10px;padding:4px 9px;margin-bottom:5px;font-size:13px;color:var(--muted)}
.msgtools{display:none;gap:6px;margin-top:3px}.msg.open .msgtools{display:flex}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:9px 14px;resize:none;max-height:120px}
.sendbtn{background:var(--accent);color:var(--accent-fg);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.sendbtn:disabled{opacity:.45}
#replybar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--surface);color:var(--muted)}
/* feed */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;font-size:12px;color:var(--muted)}
.story span:last-child{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:2px;border-radius:50%;background:conic-gradient(var(--accent),#7aa2ff,var(--accent))}
.ring .avatar{border:2px solid var(--bg);width:52px;height:52px}
.ring.add{background:var(--surface2);display:grid;place-items:center;width:56px;height:56px;color:var(--accent)}
.post{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post .head{display:flex;align-items:center;gap:10px}
.post .media{width:100%;max-height:480px;object-fit:cover;border-radius:14px;display:block;background:var(--surface2)}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.actions{display:flex;gap:18px}
.act{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.act.on{color:var(--danger)}.act.on .icon{fill:currentColor}
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.swatch{width:36px;height:36px;border-radius:50%;outline:2px solid transparent;outline-offset:2px}
.swatch[aria-checked="true"]{outline-color:var(--fg)}
.date{width:48px;text-align:center;border-radius:12px;background:var(--surface2);padding:6px 0;flex:none}
.date b{display:block;font-size:20px;line-height:1.1}.date span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.item{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.item .pic{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface2)}
.item .pic img{width:100%;height:100%;object-fit:cover;display:block}
.item .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}
.item .ph .icon{width:40px;height:40px}
.item .price{font-weight:800;color:var(--accent);margin-top:4px}
.soldtag{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.bubble audio{display:block;width:230px;max-width:100%;margin-bottom:4px}
.recbar{flex:1;display:flex;align-items:center;gap:10px;padding:2px 6px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#homebg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
#homebg .slide{position:absolute;inset:0;background:var(--bgimg) var(--bgpos,center)/cover no-repeat;opacity:0}
#homebg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,color-mix(in srgb,var(--bg) 14%,transparent))}
#v-home{z-index:1}
#v-home .story span:last-child{background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--fg);padding:1px 8px;border-radius:999px;max-width:72px}
#v-home .empty{background:color-mix(in srgb,var(--surface) 86%,transparent);border-radius:16px;padding:16px 14px;margin-top:6px}
#v-home .post{box-shadow:0 2px 12px rgba(0,0,0,.18)}
#updbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px}
.updcard{background:var(--surface);color:var(--fg);border-radius:22px;padding:24px 22px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.updcard h2{margin:0;font-size:20px}
.updcard p{margin:0;color:var(--muted);line-height:1.45}
/* sheet */
#sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-height:90%;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sheet .sbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.sheet h2{margin:0;font-size:19px}.sheethead{display:flex;align-items:center;justify-content:space-between}
#storyview{position:absolute;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff}
#storyview .stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
#storyview img,#storyview video{max-width:100%;max-height:100%;object-fit:contain}
#storyview .cap{padding:12px 16px;text-align:center}
#storyview .bar{height:3px;background:#fff4;margin:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
#storyview .bar i{display:block;height:100%;width:0;background:#fff}
#storyhead{display:flex;align-items:center;gap:10px;padding:8px 12px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90%;text-align:center}
/* auth */
#auth{height:100%;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
#auth h1{margin:8px 0 0;font-size:28px;letter-spacing:-.02em}
#auth p{margin:0;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:20px}
[hidden]{display:none!important}
</style>
</head>

function q(res){if(res.error)throw res.error;return res.data}

/* ===== storage helpers: shrink photos, delete files with their rows ===== */
function shrinkImage(file){
  var t=file.type||"";
  if(t.indexOf("image/")!==0||t==="image/gif"||t==="image/svg+xml")return Promise.resolve(file);
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onerror=function(){URL.revokeObjectURL(url);res(file)};
    img.onload=function(){
      URL.revokeObjectURL(url);
      var sc=Math.min(1,1280/Math.max(img.width,img.height));
      if(sc===1&&file.size<300*1024){res(file);return}
      var c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){
        if(!b||b.size>=file.size){res(file);return}
        res(new File([b],(file.name.replace(/\.[^.]+$/,"")||"photo")+".jpg",{type:"image/jpeg"}))},"image/jpeg",.78)};
    img.src=url});
}
function pathFromUrl(u){var k="/object/public/media/",i=(u||"").indexOf(k);return i<0?null:decodeURIComponent(u.slice(i+k.length).split("?")[0])}
function rmFiles(urls){
  var ps=(urls||[]).map(pathFromUrl).filter(Boolean);
  if(!ps.length)return Promise.resolve();
  return Promise.resolve(S.sb.storage.from("media").remove(ps)).catch(function(){});
}
function cleanStories(){
  var cutoff=new Date(Date.now()-864e5).toISOString();
  toast("Cleaning...");
  S.sb.from("stories").select("id,media_url").lt("created_at",cutoff).limit(500).then(function(r){
    var rows=q(r);if(!rows.length){toast("No old stories to clean.");return}
    return S.sb.from("stories").delete().in("id",rows.map(function(x){return x.id})).select().then(function(d){
      var del=q(d);
      if(!del.length){toast("Couldn't delete. Run the admin SQL first.");return}
      return rmFiles(del.map(function(x){return x.media_url})).then(function(){toast("Cleaned "+del.length+" old stories");loadCampusData()})})}).catch(fail);
}

function nextHomeBg(){
  var bg=$("#homebg");if(!bg){clearInterval(homeTimer);homeTimer=null;return}
  if(document.hidden||bg.hidden)return;
  var sl=bg.querySelectorAll(".slide");if(sl.length<2)return;
  var first=homeIdx<0,still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  homeIdx=(homeIdx+1)%HOME_PICS.length;
  var front=sl[homeFront],back=sl[1-homeFront];
  back.style.transition="none";back.style.opacity="0";back.style.zIndex="2";front.style.zIndex="1";
  back.style.setProperty("--bgimg","url('"+HOME_PICS[homeIdx]+"')");back.style.setProperty("--bgpos",HOME_POS[homeIdx]);
  void back.offsetWidth;
  if(first||still){back.style.opacity="1";front.style.opacity="0"}
  else{back.style.transition="opacity 1.2s ease";back.style.opacity="1";setTimeout(function(){front.style.transition="none";front.style.opacity="0"},1300)}
  homeFront=1-homeFront;
}
function startHomeBg(){
  if(homeTimer)return;
  nextHomeBg();
  if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))homeTimer=setInterval(nextHomeBg,7000);
}

/* ===== save to phone (one tap, no browser menu) ===== */
function saveMedia(url,type,label){
  if(!url)return;
  toast("Saving...");
  fetch(url).then(function(r){if(!r.ok)throw new Error("fail");return r.blob()}).then(function(b){
    var t=type||b.type||"",ext=t.indexOf("video/")===0?(t.indexOf("quicktime")>=0?"mov":t.indexOf("webm")>=0?"webm":"mp4"):t.indexOf("audio/")===0?(t.indexOf("mp4")>=0?"m4a":t.indexOf("ogg")>=0?"ogg":"webm"):t.indexOf("png")>=0?"png":t.indexOf("gif")>=0?"gif":"jpg";
    var a=document.createElement("a"),u=URL.createObjectURL(b);
    a.href=u;a.download="CampusConnect-"+(label||"media")+"-"+Date.now()+"."+ext;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
    toast("Saved to your phone. Open Gallery or Downloads.")
  }).catch(function(){toast("Couldn't save. Check your internet and try again.")});
}

/* ===== brightness ===== */
function getBright(){var v=100;try{var x=parseInt(localStorage.getItem("cc-bright"),10);if(x>=40&&x<=130)v=x}catch(e){}return v}
function applyBright(){var a=$("#app");if(!a)return;var v=getBright();a.style.filter=v===100?"":"brightness("+(v/100)+")"}
function brightSlider(){
  var lab=h("div",{class:"sub",text:"Screen brightness: "+getBright()+"%"});
  var r=h("input",{type:"range",min:"40",max:"130",step:"5",value:String(getBright()),"aria-label":"Screen brightness",style:"width:100%"});
  r.addEventListener("input",function(){try{localStorage.setItem("cc-bright",r.value)}catch(e){}lab.textContent="Screen brightness: "+r.value+"%";applyBright()});
  return h("div",{style:"display:flex;flex-direction:column;gap:4px"},lab,r)
}

/* ===== back button: close the top screen instead of leaving the app ===== */
var pendingBacks=0,pushQ=[],exitArmed=false,exitT=null,curStoryEnd=null;
function pushLayer(){if(pendingBacks>0)pushQ.push(1);else history.pushState({l:"layer"},"")}
function uiBack(){pendingBacks++;history.back()}
function onPop(ev){
  if(pendingBacks>0){pendingBacks--;if(pendingBacks===0){while(pushQ.length){pushQ.shift();history.pushState({l:"layer"},"")}}return}
  var st=ev.state&&ev.state.l;
  if($("#storyview")){if(curStoryEnd)curStoryEnd(true);else $("#storyview").remove();return}
  if($("#sheetwrap")){closeSheet(true);return}
  if($("#room")){closeRoom(true);return}
  if(S.tab!=="home"&&$("#v-home")){setTab("home");if(st==="base")history.pushState({l:"home"},"");return}
  if(st==="base"){
    if(exitArmed){history.back();return}
    exitArmed=true;toast("Press back again to exit");history.pushState({l:"home"},"");
    clearTimeout(exitT);exitT=setTimeout(function(){exitArmed=false},2200)}
}

/* ===== my own chat background photo (saved on this phone) ===== */
function bgKey(){return "cc-bgimg-"+S.uid}
function getBgImg(){try{return localStorage.getItem(bgKey())}catch(e){return null}}
function getBgOp(){var v=70;try{var x=parseInt(localStorage.getItem("cc-bgop-"+S.uid),10);if(x>=10&&x<=100)v=x}catch(e){}return v}
function setBgOp(v){try{localStorage.setItem("cc-bgop-"+S.uid,String(v))}catch(e){}}
function bgSlider(){
  var lab=h("div",{class:"sub",text:"Background opacity: "+getBgOp()+"%"});
  var r=h("input",{type:"range",min:"10",max:"100",step:"5",value:String(getBgOp()),"aria-label":"Background opacity",style:"width:100%"});
  r.addEventListener("input",function(){setBgOp(+r.value);lab.textContent="Background opacity: "+r.value+"%";applyChatBg($("#msgs"))});
  return h("div",{style:"display:flex;flex-direction:column;gap:4px;margin-top:6px"},lab,r)
}
function setBgImg(v){try{if(v)localStorage.setItem(bgKey(),v);else localStorage.removeItem(bgKey())}catch(e){}}
function applyChatBg(el){
  if(!el)return;var im=getBgImg();
  if(im){var ov=100-getBgOp(),cv="color-mix(in srgb,var(--chat) "+ov+"%,transparent)";el.setAttribute("data-bg","image");el.style.backgroundImage="linear-gradient("+cv+","+cv+"),url('"+im+"')"}
  else{el.style.backgroundImage="";el.setAttribute("data-bg",(S.me&&S.me.chat_bg)||"plain")}
}
function pickBgPhoto(){
  return pickFile("image/*").then(function(f){
    if(!f)return false;
    return new Promise(function(res,rej){
      var rd=new FileReader();
      rd.onerror=function(){rej({message:"Couldn't read that photo."})};
      rd.onload=function(){var img=new Image();
        img.onerror=function(){rej({message:"Couldn't open that photo."})};
        img.onload=function(){

      h("button",{class:"btn",onclick:function(){pickFile("image/*").then(function(f){if(!f)return;toast("Uploading...");return upload(f).then(function(u){return S.sb.from("app_settings").upsert({key:"menu_bg",value:u.url})}).then(function(r){q(r);S.settings.menu_bg=S.settings.menu_bg;return loadCore()}).then(function(){toast("Background updated");draw();render()})}).catch(fail)}},"Upload image"),
      S.settings.menu_bg?h("button",{class:"btn ghost",onclick:function(){S.sb.from("app_settings").delete().eq("key","menu_bg").then(function(){delete S.settings.menu_bg;draw();render()})}},"Remove"):null));
    body.append(h("div",{class:"label"},"Storage"),h("button",{class:"btn ghost",onclick:cleanStories},"Clean up old stories"),h("div",{class:"sub",text:"Deletes stories older than 24 hours together with their photos and videos."}));
    body.append(h("div",{class:"label"},"Campuses"));
    S.campuses.forEach(function(c){body.append(h("div",{class:"row"},h("div",{class:"grow"},h("div",{class:"name",text:c.name}),h("div",{class:"sub",text:c.short||""})),
      S.campuses.length>1?h("button",{class:"btn danger",onclick:function(){S.sb.from("campuses").delete().eq("id",c.id).then(function(r){q(r);return loadCore()}).then(function(){if(!S.campuses.some(function(x){return x.id===S.cid}))S.cid=S.campuses[0].id;draw();loadCampusData()}).catch(fail)}},"Remove"):null))});
    var cn=h("input",{class:"field",id:"cn",placeholder:"New campus name"}),cs=h("input",{class:"field",id:"cs",maxlength:"6",placeholder:"Short name, e.g. MUK"});
    body.append(cn,cs,h("button",{class:"btn ghost",onclick:function(){var n=cn.value.trim();if(!n){cn.focus();return}S.sb.from("campuses").insert({name:n,short:cs.value.trim()||null}).then(function(r){q(r);return loadCore()}).then(function(){draw();render()}).catch(fail)}},"Add campus"));
    body.append(h("div",{class:"label"},"People ("+Object.keys(S.profiles).length+")"));
    Object.keys(S.profiles).forEach(function(id){var p=S.profiles[id];
      body.append(h("div",{class:"row"},avatar(id,"sm"),h("div",{class:"grow"},h("div",{class:"name",text:p.name}),h("div",{class:"sub",text:p.is_admin?"Admin":"Student"})),
        id===S.uid?null:h("button",{class:"chip",onclick:function(){S.sb.from("profiles").update({is_admin:!p.is_admin}).eq("id",id).then(function(r){q(r);return loadCore()}).then(draw).catch(fail)}},p.is_admin?"Remove admin":"Make admin")))});
    body.append(h("div",{class:"label"},"Rooms on this campus"));
    S.rooms.forEach(function(r){body.append(h("div",{class:"row"},h("div",{class:"grow name",text:r.name}),h("button",{class:"btn danger",onclick:function(){S.sb.from("rooms").delete().eq("id",r.id).then(function(x){q(x);return loadCampusData()}).then(draw).catch(fail)}},"Delete")))});
  }
  draw();openSheet("Admin panel",body);
}

/* ===== campus choice for new accounts ===== */
function saveCampus(id){
  return S.sb.from("profiles").update({campus_id:id}).eq("id",S.uid).then(function(r){
    q(r);try{localStorage.removeItem("cc-pending-campus")}catch(e){}return loadCore()})
}
function ensureCampus(){
  if(S.me.campus_id||!S.campuses.length)return Promise.resolve();
  var pend="";try{pend=localStorage.getItem("cc-pending-campus")||""}catch(e){}
  if(pend&&S.campuses.some(function(c){return c.id===pend}))return saveCampus(pend);
  if(S.campuses.length<2)return saveCampus(S.campuses[0].id);
  return new Promise(function(res){
    var app=$("#app");app.textContent="";var list=h("div",{});
    S.campuses.forEach(function(c){
      list.append(h("button",{class:"row",onclick:function(){saveCampus(c.id).then(res).catch(fail)}},
        h("div",{class:"grow"},h("div",{class:"name",text:c.name}),h("div",{class:"sub",text:c.short||""}))))});
    app.append(h("div",{id:"auth"},h("h1",{text:"Choose your campus"}),h("p",{text:"You will see chats, events and posts from your campus."}),list))})
}

/* ===== boot ===== */
function start(session){
  if(!session){S.uid=null;S.me=null;if(S.chan){S.sb.removeChannel(S.chan);S.chan=null}showAuth();return}
  S.uid=session.user.id;
  loadCore().then(ensureCampus).then(function(){buildShell();homeIdx=-1;clearInterval(homeTimer);homeTimer=null;setTab("home");startHomeBg();return loadCampusData()}).then(subscribe).catch(function(e){
    $("#app").textContent="";$("#app").append(h("div",{id:"auth"},h("h1",{text:"Couldn't start"}),h("p",{text:navigator.onLine?((e&&e.message)||"Reload the page to try again."):"You are offline. Connect to the internet and the app will reload by itself."}),h("button",{class:"btn",onclick:function(){location.reload()}},"Reload")))});
}
function boot(){
  applyMode();applyBright();
  history.replaceState({l:"base"},"");history.pushState({l:"home"},"");
  window.addEventListener("popstate",onPop);
  window.addEventListener("online",function(){var t=$("#auth h1");if(t&&t.textContent==="Couldn't start")location.reload()});
  if(!window.supabase){$("#app").textContent="Couldn't load. Check your connection and reload.";return}
  if(SUPABASE_ANON_KEY.indexOf("PASTE")===0){$("#app").append(h("div",{id:"auth"},h("h1",{text:"One step left"}),h("p",{text:"Open index.html and paste your Supabase publishable (anon) key where it says PASTE_YOUR_ANON_KEY_HERE."})));return}
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var first=true;
  S.sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){
      if(ev==="SIGNED_IN"&&!first&&S.uid===(session&&session.user.id))return;
      first=false;setTimeout(function(){start(session)},0)}
  });
  var updating=false,snoozeUntil=0;
  function showUpdate(w){
    if(document.getElementById("updbox")||Date.now()<snoozeUntil)return;
    var box=h("div",{id:"updbox",role:"dialog","aria-modal":"true","aria-label":"Update available"},
      h("div",{class:"updcard"},h("h2",{text:"Update available"}),
        h("p",{text:"A new version of Campus Connect is ready. Update now to get the latest features and fixes. The app will restart."}),
        h("button",{class:"btn",onclick:function(e){updating=true;e.currentTarget.disabled=true;e.currentTarget.textContent="Updating...";try{w.postMessage({type:"SKIP_WAITING"})}catch(x){}setTimeout(function(){location.reload()},4000)}},"Update now"),
        h("button",{class:"btn ghost",onclick:function(){snoozeUntil=Date.now()+2*3600*1000;box.remove()}},"Later")));
    document.body.append(box);
  }
  if("serviceWorker" in navigator)window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function offer(w){if(w&&navigator.serviceWorker.controller)showUpdate(w)}
      if(reg.waiting)offer(reg.waiting);
      reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;w.addEventListener("statechange",function(){if(w.state==="installed")offer(w)})});
      function check(){reg.update().then(function(){if(reg.waiting)offer(reg.waiting)}).catch(function(){})}
      setInterval(check,30*60*1000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(updating)location.reload()});
  });
}
boot();
})();
</script>
